---
layout: default
---

<article>
  <div>
    <h1>{{ page.title }}</h1>
    <time datetime="{{ page.last_modified_at | date_to_xmlschema }}">{% if page.type != 'pages' %}
      Last updated on {{ page.last_modified_at | date: "%B %-d, %Y" }}
      {% endif %}
    </time>
  </div>

  <content>
    <section>
      {{ content }}
    </section>
  </content>
  <!--
    The backlinks widget ("Notes mentioning this note") was removed from
    here on purpose, but the underlying data is still being computed —
    page.backlinks is populated by a plugin (see _plugins/) and is what
    powers notes_graph.html below. If you want to bring some form of
    backlinks display back, that data is already available; you'd just
    need to loop over page.backlinks again, e.g.:

      {% raw %}{% if page.backlinks.size > 0 %}
        {% for backlink in page.backlinks %}
          {{ backlink.title }} / {{ backlink.url }} / {{ backlink.excerpt }}
        {% endfor %}
      {% endif %}{% endraw %}
  -->
</article>

<hr>


{% include notes_graph.html %}
